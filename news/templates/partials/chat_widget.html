<style>
#ai-chat-widget * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
#ai-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #c0152a;
    color: #fff;
    border: none;
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(192,21,42,0.4);
    transition: transform .25s, box-shadow .25s;
}
#ai-chat-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(192,21,42,0.55);
}
#ai-chat-btn svg {
    width: 26px;
    height: 26px;
}
#ai-chat-panel {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 370px;
    max-width: calc(100vw - 48px);
    height: 520px;
    max-height: calc(100vh - 120px);
    background: #1a1a1a;
    border-radius: 16px;
    display: none;
    flex-direction: column;
    z-index: 9998;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    border: 1px solid #333;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
}
#ai-chat-panel.open {
    display: flex;
}
#ai-chat-header {
    background: #0f0f0f;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #c0152a;
    flex-shrink: 0;
}
#ai-chat-header h3 {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#ai-chat-header h3 span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse-dot 1.8s infinite;
}
@keyframes pulse-dot {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
}
#ai-chat-close {
    background: none;
    border: none;
    color: #888;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color .2s;
}
#ai-chat-close:hover {
    color: #fff;
}
#ai-chat-msgs {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #1a1a1a;
}
#ai-chat-msgs::-webkit-scrollbar {
    width: 5px;
}
#ai-chat-msgs::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 3px;
}
.ai-msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: msg-in .3s ease;
}
@keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.ai-msg.user {
    align-self: flex-end;
    background: #c0152a;
    color: #fff;
    border-bottom-right-radius: 4px;
}
.ai-msg.bot {
    align-self: flex-start;
    background: #2a2a2a;
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
}
.ai-msg.error {
    align-self: flex-start;
    background: #2d1a1a;
    color: #f87171;
    border-bottom-left-radius: 4px;
}
.ai-msg.loading {
    align-self: flex-start;
    background: #2a2a2a;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
}
.ai-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #555;
    border-top-color: #c0152a;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
#ai-chat-input-wrap {
    display: flex;
    padding: 12px 14px;
    gap: 8px;
    background: #0f0f0f;
    border-top: 1px solid #333;
    flex-shrink: 0;
}
#ai-chat-input {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 24px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border .2s;
}
#ai-chat-input:focus {
    border-color: #c0152a;
}
#ai-chat-input::placeholder {
    color: #777;
}
#ai-chat-send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #c0152a;
    color: #fff;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
}
#ai-chat-send:hover {
    background: #a01222;
}
#ai-chat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
#ai-chat-send svg {
    width: 18px;
    height: 18px;
}
</style>

<div id="ai-chat-widget">
    <button id="ai-chat-btn" aria-label="Mo tro ly AI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <line x1="9" y1="10" x2="15" y2="10"/>
            <line x1="12" y1="7" x2="12" y2="13"/>
        </svg>
    </button>

    <div id="ai-chat-panel">
        <div id="ai-chat-header">
            <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="#c0152a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                AI Tro ly The thao
                <span></span>
            </h3>
            <button id="ai-chat-close">&times;</button>
        </div>
        <div id="ai-chat-msgs">
            <div class="ai-msg bot">
                Chao ban! Minh la tro ly AI The thao cua <strong>THENHDEPTRAI</strong>. Ban co the hoi toi bat ky tin tuc the thao, ket qua tran dau, chuyen nhuong moi nhat!
            </div>
        </div>
        <div id="ai-chat-input-wrap">
            <input id="ai-chat-input" type="text" placeholder="Nhap cau hoi the thao..." autocomplete="off">
            <button id="ai-chat-send" aria-label="Gui">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    var btn = document.getElementById('ai-chat-btn');
    var panel = document.getElementById('ai-chat-panel');
    var closeBtn = document.getElementById('ai-chat-close');
    var msgsEl = document.getElementById('ai-chat-msgs');
    var input = document.getElementById('ai-chat-input');
    var sendBtn = document.getElementById('ai-chat-send');
    var loading = false;

    function openPanel() {
        panel.classList.add('open');
        btn.style.display = 'none';
        input.focus();
    }

    function closePanel() {
        panel.classList.remove('open');
        btn.style.display = 'flex';
    }

    btn.addEventListener('click', openPanel);
    closeBtn.addEventListener('click', closePanel);

    function scrollBottom() {
        msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function addMsg(text, type) {
        var div = document.createElement('div');
        div.className = 'ai-msg ' + type;
        div.textContent = text;
        msgsEl.appendChild(div);
        scrollBottom();
        return div;
    }

    function addLoading() {
        var div = document.createElement('div');
        div.className = 'ai-msg loading';
        div.id = 'ai-loading-msg';
        var spinner = document.createElement('span');
        spinner.className = 'ai-spinner';
        div.appendChild(spinner);
        div.appendChild(document.createTextNode(' Dang tra loi...'));
        msgsEl.appendChild(div);
        scrollBottom();
    }

    function removeLoading() {
        var el = document.getElementById('ai-loading-msg');
        if (el) el.remove();
    }

    function sendMessage() {
        var text = input.value.trim();
        if (!text || loading) return;

        input.value = '';
        addMsg(text, 'user');
        loading = true;
        sendBtn.disabled = true;
        addLoading();

        fetch('/chat-api/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        })
        .then(function(r) {
            return r.text().then(function(text) {
                try {
                    var data = JSON.parse(text);
                    if (!r.ok) {
                        throw new Error(data.error || 'Loi may chu (ma ' + r.status + ')');
                    }
                    return data;
                } catch (e) {
                    if (e instanceof SyntaxError) {
                        throw new Error('May chu tra ve trang HTML (ma ' + r.status + '). Vui long thu lai sau.');
                    }
                    throw e;
                }
            });
        })
        .then(function(data) {
            removeLoading();
            addMsg(data.reply || 'Khong nhan duoc phan hoi.', 'bot');
        })
        .catch(function(err) {
            removeLoading();
            addMsg('Loi: ' + err.message, 'error');
        })
        .finally(function() {
            loading = false;
            sendBtn.disabled = false;
            input.focus();
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
})();
</script>
