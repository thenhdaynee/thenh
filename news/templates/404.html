{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang - THENHDEPTRAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c0152a'/><text x='50' y='70' text-anchor='middle' font-size='60' font-weight='bold' fill='white' font-family='Arial'>T</text></svg>">
    <style>
        body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .font-display { font-family: inherit; font-weight: 700; }
    </style>
</head>
<body class="bg-[#0f0f0f] min-h-screen flex items-center justify-center">
    <button id="back-to-top" aria-label="Lên đầu trang" style="display:none">↑</button>
    <div class="text-center px-6">
        <p class="font-display text-[120px] md:text-[180px] font-bold text-[#c0152a] leading-none">404</p>
        <h1 class="font-display text-2xl md:text-3xl font-bold text-white mt-4">Trang không tồn tại</h1>
        <p class="text-gray-400 text-sm md:text-base mt-3 max-w-md mx-auto">Trang ban tìm kiếm khong ton tai hoac da bi xoa. Hay quay lai trang chủ de tiep tuc doc tin tức.</p>
        <a href="/" class="inline-block mt-8 font-display bg-[#c0152a] hover:bg-[#96101f] text-white font-bold px-8 py-3 text-sm tracking-widest uppercase transition-colors rounded">
            ← Quay lai trang chủ
        </a>
    </div>
<script>
(function() {
    var btn = document.getElementById('back-to-top');
    if (!btn) return;
    window.addEventListener('scroll', function() {
        if (window.scrollY > 400) { btn.classList.add('show'); }
        else { btn.classList.remove('show'); }
    });
    btn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();
</script>
</body>
</html>
